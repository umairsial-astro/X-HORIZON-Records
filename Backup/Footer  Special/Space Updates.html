<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Space News</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,600&amp;family=Schibsted+Grotesk:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#000}
#xhn{--bg:#000;--s1:#080808;--ln:#222;--tx:#ececec;--mu:#8a8a8a;--w:#f4f4f4;
 background:var(--bg);color:var(--tx);font:15px/1.5 'Schibsted Grotesk',system-ui,sans-serif;min-height:100vh;padding:28px clamp(16px,4vw,48px) 56px;box-sizing:border-box}
#xhn *{box-sizing:border-box}
:where(#xhn) :is(button,input,select){font:inherit;color:inherit}
#xhn :focus-visible{outline:2px solid var(--w);outline-offset:2px}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:14px 22px;padding-bottom:16px;position:relative;border-bottom:1px solid var(--ln)}
.live{display:flex;align-items:center;gap:10px;font:500 22px 'Newsreader',serif}
.live i{width:9px;height:9px;border-radius:50%;background:var(--w);box-shadow:0 0 0 0 #fff8}
.scan .live i{animation:pulse 1.2s infinite}
@keyframes pulse{to{box-shadow:0 0 0 10px #fff0}}
.meta{color:var(--mu);font-size:13px;flex:1;min-width:200px}
.prog{position:absolute;left:0;bottom:-1px;height:2px;width:0;background:var(--w);transition:width .35s,opacity .6s}
.btn{background:none;border:1px solid var(--ln);border-radius:999px;padding:7px 16px;cursor:pointer}
.btn:hover{border-color:var(--w)}
#log{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:6px 20px;padding:14px 0;border-bottom:1px solid var(--ln);font-size:12.5px;color:var(--mu)}
#log[hidden]{display:none}
#log b{color:var(--tx);font-weight:500}
.flt{display:flex;flex-wrap:wrap;gap:10px;margin:18px 0 8px}
.flt input,.flt select{background:var(--s1);border:1px solid var(--ln);border-radius:8px;padding:8px 12px}
.flt input{flex:1;min-width:200px}
.flt select{max-width:190px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chip{background:none;border:1px solid var(--ln);color:var(--mu);border-radius:999px;padding:4px 13px;cursor:pointer;font-size:13px}
.chip:hover{color:var(--w)}
.chip[aria-pressed=true]{background:var(--w);color:#000;border-color:var(--w)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:18px;margin-top:20px}
.card{display:flex;flex-direction:column;background:var(--s1);border:1px solid var(--ln);border-radius:6px;overflow:hidden;color:inherit;text-decoration:none;transition:border-color .2s}
.card:hover{border-color:#777}
.im{position:relative;aspect-ratio:16/9;background:#0d0d0d;overflow:hidden}
.im img{width:100%;height:100%;object-fit:cover;display:block;filter:grayscale(.25) contrast(1.05)}
.im.ph::after{content:attr(data-i);position:absolute;inset:0;display:grid;place-items:center;font:600 34px 'Newsreader',serif;color:#2c2c2c;letter-spacing:.04em}
.im.ph{background:radial-gradient(circle at var(--x) var(--y),#1c1c1c,#050505 70%)}
.new{position:absolute;top:10px;left:10px;background:var(--w);color:#000;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px}
.bd{padding:14px 16px 16px;display:flex;flex-direction:column;gap:8px;flex:1}
.tg{font-size:12.5px;color:var(--mu)}
.card h3{margin:0;font:600 19px/1.25 'Newsreader',serif;color:var(--w)}
.card p{margin:0;color:#b4b4b4;font-size:14px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.ft{margin-top:auto;padding-top:6px;display:flex;justify-content:space-between;gap:10px;font-size:12.5px;color:var(--mu)}
.ft b{color:var(--tx);font-weight:500}
@media(min-width:760px){.card.big{grid-column:span 2;grid-row:span 2}.big h3{font-size:30px}.big p{font-size:15.5px;-webkit-line-clamp:5}}
.sk{height:300px;border:1px solid var(--ln);border-radius:6px;background:linear-gradient(100deg,#080808 30%,#141414 50%,#080808 70%) 0 0/300% 100%;animation:sh 1.4s infinite}
@keyframes sh{to{background-position:-200% 0}}
.empty{grid-column:1/-1;text-align:center;color:var(--mu);padding:70px 10px}
.empty b{display:block;font:500 22px 'Newsreader',serif;color:var(--tx);margin-bottom:6px}
#more{display:block;margin:28px auto 0}
#toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,80px);background:var(--w);color:#000;padding:9px 20px;border-radius:999px;font-weight:500;transition:transform .3s;z-index:9}
#toast.on{transform:translate(-50%,0)}
@media(prefers-reduced-motion:reduce){#xhn *{animation:none!important;transition:none!important}}
</style>


<div id="xhn">
 <section class="bar" id="bar">
  <div class="live"><i></i><span id="st">Scanning the sky</span></div>
  <div class="meta" id="meta"></div>
  <button class="btn" id="rf">Scan now</button>
  <button class="btn" id="lg" aria-expanded="false">Sources</button>
  <div class="prog" id="pg"></div>
 </section>
 <div id="log" hidden=""></div>
 <div class="flt">
  <input id="q" type="search" placeholder="Search stories  ( / )" aria-label="Search stories">
  <select id="sf" aria-label="Filter by source"></select>
  <select id="wf" aria-label="Filter by time"><option value="0">Any time</option><option value="24">Last 24 hours</option><option value="168">Last 7 days</option></select>
 </div>
 <div class="chips" id="rc" aria-label="Regions"></div>
 <div class="chips" id="tc" aria-label="Topics"></div>
 <main class="grid" id="out"></main>
 <button class="btn" id="more" hidden="">Load more stories</button>
 <div id="toast" role="status"></div>
</div>

<script>
(()=>{
/* ---------- settings ---------- */
const CFG={refreshMin:10,timeout:9000,page:18,maxAgeDays:30,rss2jsonKey:''};
const GN=(h,g,c)=>`https://news.google.com/rss/search?q=${encodeURIComponent('astronomy OR "space telescope" OR exoplanet OR NASA OR ESA OR ISRO OR JAXA OR galaxy when:7d')}&hl=${h}&gl=${g}&ceid=${c}`;
const SRC=[
 {n:'Spaceflight News API',t:'sfn',r:'Global'},
 {n:'NASA',u:'https://www.nasa.gov/feed/',r:'North America'},
 {n:'NASA Science',u:'https://science.nasa.gov/feed/',r:'North America'},
 {n:'Space.com',u:'https://www.space.com/feeds/all',r:'North America'},
 {n:'SpaceNews',u:'https://spacenews.com/feed/',r:'North America'},
 {n:'Sky & Telescope',u:'https://skyandtelescope.org/feed/',r:'North America'},
 {n:'Astronomy Magazine',u:'https://www.astronomy.com/feed/',r:'North America'},
 {n:'EarthSky',u:'https://earthsky.org/feed/',r:'North America'},
 {n:'Universe Today',u:'https://www.universetoday.com/feed',r:'North America'},
 {n:'ESA',u:'https://www.esa.int/rssfeed/Our_Activities/Space_Science',r:'Europe'},
 {n:'ESO',u:'https://www.eso.org/public/news/feed/',r:'Europe'},
 {n:'ESA/Webb',u:'https://esawebb.org/news/feed/',r:'Europe'},
 {n:'Astronomy Now',u:'https://astronomynow.com/feed/',r:'Europe'},
 {n:'Phys.org Astronomy',u:'https://phys.org/rss-feed/space-news/astronomy/',r:'Global'},
 {n:'ScienceDaily',u:'https://www.sciencedaily.com/rss/space_time/astronomy.xml',r:'Global'},
 ...[['United States','en-US','US','US:en','North America'],['Canada','en-CA','CA','CA:en','North America'],['United Kingdom','en-GB','GB','GB:en','Europe'],['Ireland','en-IE','IE','IE:en','Europe'],['India','en-IN','IN','IN:en','Asia'],['Pakistan','en-PK','PK','PK:en','Asia'],['Singapore','en-SG','SG','SG:en','Asia'],['Australia','en-AU','AU','AU:en','Oceania'],['New Zealand','en-NZ','NZ','NZ:en','Oceania'],['South Africa','en-ZA','ZA','ZA:en','Africa'],['Nigeria','en-NG','NG','NG:en','Africa']]
  .map(([n,h,g,c,r])=>({n:'Google News '+n,u:GN(h,g,c),r,gn:1}))
];
const TOPICS=[
 ['Missions & launches',/launch|rocket|mission|spacecraft|probe|rover|orbiter|lander|satellite|starship|artemis|astronaut|crew|space station|capsule|gaganyaan|chandrayaan/i],
 ['Sun & space weather',/solar flare|sunspot|geomagnetic|coronal|space weather|solar storm|solar wind|\bsun\b/i],
 ['Sky events',/eclipse|meteor|aurora|conjunction|supermoon|stargaz|night sky|full moon|tonight|visible/i],
 ['Exoplanets & life',/exoplanet|habitable|biosignature|alien|extraterrestrial|seti|\blife\b/i],
 ['Telescopes & deep sky',/telescope|jwst|webb|hubble|galax|nebula|cluster|observatory|black hole|supernova|pulsar|quasar|star\b|stars\b/i],
 ['Planets & moons',/mars|jupiter|saturn|venus|mercury|moon|lunar|asteroid|comet|solar system|europa|titan|neptune|uranus|pluto/i],
 ['Cosmology & physics',/dark matter|dark energy|big bang|universe|cosmic|gravitational|cosmolog|neutrino|inflation/i]
];
/* ---------- helpers ---------- */
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safe=u=>/^https?:\/\//i.test(u||'')?u:'';
const text=h=>{const t=new DOMParser().parseFromString(h||'','text/html').body.textContent||'';return t.replace(/\s+/g,' ').trim()};
const firstImg=h=>{const m=/<img[^>]+src=["']([^"']+)/i.exec(h||'');return m?m[1]:''};
const key=t=>t.toLowerCase().replace(/[^a-z0-9]+/g,'').slice(0,60);
const hash=s=>[...s].reduce((a,c)=>(a*31+c.charCodeAt(0))>>>0,7);
const ago=ms=>{const m=Math.max(0,(Date.now()-ms)/6e4);if(m<60)return Math.max(1,Math.round(m))+' min ago';if(m<1440)return Math.round(m/60)+' h ago';if(m<10080)return Math.round(m/1440)+' d ago';return new Date(ms).toLocaleDateString(undefined,{day:'numeric',month:'short'})};
const topic=s=>{for(const[n,r]of TOPICS)if(r.test(s))return n;return 'General astronomy'};
const toast=m=>{const t=$('toast');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),3500)};
const parseDate=v=>{if(!v)return 0;let d=Date.parse(/^\d{4}-\d\d-\d\d \d\d:\d\d:\d\d$/.test(v)?v.replace(' ','T')+'Z':v);return isNaN(d)?0:d};
const timed=(u,ms=CFG.timeout)=>{const c=new AbortController(),t=setTimeout(()=>c.abort(),ms);return fetch(u,{signal:c.signal}).finally(()=>clearTimeout(t))};

/* ---------- fetching ---------- */
const kid=(el,names)=>{for(const c of el.children)if(names.includes(c.localName))return c;return null};
function parseXML(x){
 const doc=new DOMParser().parseFromString(x,'text/xml');
 if(doc.querySelector('parsererror'))throw new Error('bad xml');
 return [...doc.querySelectorAll('item,entry')].map(e=>{
  const g=n=>{const k=kid(e,n);return k?(k.textContent||''):''};
  const l=kid(e,['link']);const body=g(['encoded','content','description','summary']);
  let img='';for(const c of e.children){const ln=c.localName,ty=c.getAttribute('type')||'';
   if((ln==='content'||ln==='thumbnail')&&c.getAttribute('url')&&(!ty||ty.startsWith('image')))img=img||c.getAttribute('url');
   if(ln==='enclosure'&&ty.startsWith('image'))img=img||c.getAttribute('url')}
  return{title:g(['title']),link:l?(l.getAttribute('href')||l.textContent):'',date:g(['pubDate','published','updated','date']),html:body,img:img||firstImg(body)}});
}
const VIA=[
 ['rss2json',async u=>{const j=await(await timed('https://api.rss2json.com/v1/api.json?rss_url='+encodeURIComponent(u)+(CFG.rss2jsonKey?'&api_key='+CFG.rss2jsonKey+'&count=40':''))).json();
   if(j.status!=='ok')throw new Error('rss2json');
   return j.items.map(i=>({title:i.title,link:i.link,date:i.pubDate,html:i.content||i.description,img:i.thumbnail||(i.enclosure&&i.enclosure.link)||firstImg(i.content||i.description)}))}],
 ['allorigins',async u=>parseXML(await(await timed('https://api.allorigins.win/raw?url='+encodeURIComponent(u))).text())],
 ['corsproxy',async u=>parseXML(await(await timed('https://corsproxy.io/?url='+encodeURIComponent(u))).text())]
];
function norm(s,r){
 let title=text(r.title),src=s.n;
 if(s.gn){const i=title.lastIndexOf(' - ');if(i>0){src=title.slice(i+3);title=title.slice(0,i)}}
 const sum=text(r.html).slice(0,260),d=parseDate(r.date),u=safe(r.link);
 if(!title||!u||!d||Date.now()-d>CFG.maxAgeDays*864e5)return null;
 return{title,u,sum:s.gn?'':sum,img:safe(r.img),d,src,reg:s.r,top:topic(title+' '+sum),k:key(title)};
}
async function pull(s){
 const t0=performance.now();
 if(s.t==='sfn'){
  const j=await(await timed('https://api.spaceflightnewsapi.net/v4/articles/?limit=40&ordering=-published_at')).json();
  const items=j.results.map(a=>norm({n:a.news_site,r:s.r},{title:a.title,link:a.url,date:a.published_at,html:a.summary,img:a.image_url})).filter(Boolean);
  return{items,via:'direct',ms:performance.now()-t0};
 }
 let err;
 for(const[name,fn]of VIA){try{const raw=await fn(s.u);const items=raw.map(r=>norm(s,r)).filter(Boolean);if(items.length||name===VIA[VIA.length-1][0])return{items,via:name,ms:performance.now()-t0}}catch(e){err=e}}
 throw err||new Error('no data');
}

/* ---------- state ---------- */
const S={items:new Map(),logs:{},F:{q:'',reg:'All',top:'All',src:'All',win:0},shown:CFG.page,first:true,next:0,busy:false};
try{(JSON.parse(localStorage.getItem('xhn')||'[]')).forEach(i=>S.items.set(i.k,i))}catch(e){}

async function scan(){
 if(S.busy)return;S.busy=true;
 const bar=$('bar'),pg=$('pg');bar.classList.add('scan');$('st').textContent='Scanning the sky';pg.style.opacity=1;pg.style.width='3%';
 let done=0,fresh=0;const before=new Set(S.items.keys());
 const q=[...SRC];
 await Promise.all(Array(6).fill().map(async()=>{while(q.length){const s=q.shift();
  try{const r=await pull(s);S.logs[s.n]={ok:1,n:r.items.length,via:r.via,ms:r.ms};
   r.items.forEach(i=>{const old=S.items.get(i.k);if(!old){i.isNew=!S.first&&!before.has(i.k);if(i.isNew)fresh++;S.items.set(i.k,i)}else if(!old.img&&i.img)old.img=i.img});}
  catch(e){S.logs[s.n]={ok:0,err:e.message||'failed'}}
  done++;pg.style.width=(done/SRC.length*100)+'%';draw()}}));
 const cut=Date.now()-CFG.maxAgeDays*864e5;[...S.items].forEach(([k,i])=>{if(i.d<cut)S.items.delete(k)});
 try{localStorage.setItem('xhn',JSON.stringify([...S.items.values()].sort((a,b)=>b.d-a.d).slice(0,160).map(i=>({...i,isNew:0}))))}catch(e){}
 bar.classList.remove('scan');setTimeout(()=>pg.style.opacity=0,500);
 S.last=Date.now();S.next=S.last+CFG.refreshMin*6e4;S.busy=false;S.first=false;
 $('st').textContent=S.items.size?'Live astronomy news':'No stories loaded';draw();
 if(fresh)toast(fresh+' new '+(fresh>1?'stories':'story')+' found');
}

/* ---------- render ---------- */
function chips(id,label,vals,cur,set){
 const el=$(id);el.innerHTML=['All',...vals].map(v=>`<button class="chip" aria-pressed="${v===cur}" data-v="${esc(v)}">${esc(v==='All'?'All '+label:v)}</button>`).join('');
 el.onclick=e=>{const b=e.target.closest('.chip');if(b){set(b.dataset.v);S.shown=CFG.page;draw()}};
}
function draw(){
 const all=[...S.items.values()],F=S.F;
 const cnt=k=>[...new Set(all.map(i=>i[k]))].sort();
 chips('rc','regions',cnt('reg'),F.reg,v=>F.reg=v);
 chips('tc','topics',cnt('top'),F.top,v=>F.top=v);
 const sf=$('sf'),srcs=cnt('src');if(F.src!=='All'&&!srcs.includes(F.src))F.src='All';
 sf.innerHTML='<option value="All">All sources</option>'+srcs.map(s=>`<option ${s===F.src?'selected':''}>${esc(s)}</option>`).join('');
 const q=F.q.toLowerCase(),min=F.win?Date.now()-F.win*36e5:0;
 const list=all.filter(i=>(F.reg==='All'||i.reg===F.reg)&&(F.top==='All'||i.top===F.top)&&(F.src==='All'||i.src===F.src)&&i.d>=min&&(!q||(i.title+' '+i.sum+' '+i.src).toLowerCase().includes(q))).sort((a,b)=>b.d-a.d);
 // lead story: newest item that has a picture
 const li=list.findIndex(i=>i.img);if(li>0)list.unshift(list.splice(li,1)[0]);
 const out=$('out');
 if(!list.length){out.innerHTML=S.busy&&!all.length?'<div class="sk big"></div>'.repeat(1)+'<div class="sk"></div>'.repeat(5):`<div class="empty"><b>${all.length?'Nothing matches those filters':'No stories yet'}</b>${all.length?'Clear the search or choose All regions and topics.':'The feeds could not be reached. Check your connection, then press Scan now.'}</div>`}
 else out.innerHTML=list.slice(0,S.shown).map((i,n)=>{const h=hash(i.src);
  return`<a class="card${n===0?' big':''}" href="${esc(i.u)}" target="_blank" rel="noopener noreferrer"><div class="im${i.img?'':' ph'}" data-i="${esc(i.src.replace(/^Google News /,'').split(/\s+/).map(w=>w[0]).join('').slice(0,3))}" style="--x:${h%90}%;--y:${(h>>3)%90}%">${i.img?`<img src="${esc(i.img)}" alt="" loading="lazy" decoding="async" referrerpolicy="no-referrer">`:''}${i.isNew?'<span class="new">New</span>':''}</div><div class="bd"><div class="tg">${esc(i.top)} · ${esc(i.reg)}</div><h3>${esc(i.title)}</h3>${i.sum?`<p>${esc(i.sum)}</p>`:''}<div class="ft"><b>${esc(i.src)}</b><time datetime="${new Date(i.d).toISOString()}">${ago(i.d)}</time></div></div></a>`}).join('');
 $('more').hidden=list.length<=S.shown;
 // scan log
 $('log').innerHTML=SRC.map(s=>{const l=S.logs[s.n];return`<div><b>${esc(s.n)}</b><br>${!l?'Waiting':l.ok?l.n+' stories via '+l.via+' ('+Math.round(l.ms/100)/10+'s)':'Unavailable: '+esc(l.err)}</div>`}).join('');
 meta(list.length);
}
function meta(n){
 const ok=Object.values(S.logs).filter(l=>l.ok).length,tot=Object.keys(S.logs).length;
 const rem=Math.max(0,Math.round((S.next-Date.now())/1000));
 $('meta').textContent=(S.last?'Updated '+new Date(S.last).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})+'. ':'')+(S.items.size?(n??$('out').children.length)+' of '+S.items.size+' stories shown. ':'')+(tot?ok+' of '+SRC.length+' sources reachable. ':'')+(S.next&&!S.busy?'Next scan in '+Math.floor(rem/60)+':'+String(rem%60).padStart(2,'0')+'.':'');
}

/* ---------- events ---------- */
$('q').oninput=e=>{S.F.q=e.target.value;S.shown=CFG.page;draw()};
$('sf').onchange=e=>{S.F.src=e.target.value;S.shown=CFG.page;draw()};
$('wf').onchange=e=>{S.F.win=+e.target.value;S.shown=CFG.page;draw()};
$('more').onclick=()=>{S.shown+=CFG.page;draw()};
$('rf').onclick=scan;
$('lg').onclick=e=>{const l=$('log');l.hidden=!l.hidden;e.target.setAttribute('aria-expanded',!l.hidden)};
document.addEventListener('keydown',e=>{if(e.key==='/'&&document.activeElement.tagName!=='INPUT'){e.preventDefault();$('q').focus()}});
$('out').addEventListener('error',e=>{if(e.target.tagName==='IMG'){e.target.parentNode.classList.add('ph');e.target.remove()}},true);
setInterval(()=>{if(S.next&&!S.busy){Date.now()>=S.next?scan():meta()}},1000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&S.next&&Date.now()>=S.next)scan()});
draw();scan();
})();
</script>
