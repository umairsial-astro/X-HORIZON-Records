{id:"sp1",title:"Escape Velocity Comparison",diff:"Explorer",topic:"escape velocity",prompt:"Compute and compare the escape velocity of Earth and Mars using v = sqrt(2GM/r).",hint:"Write one function and call it twice with each planet's mass and radius.",solution:'import math\ndef escape_velocity(mass_kg, radius_m, G=6.674e-11):\n    return math.sqrt(2 * G * mass_kg / radius_m)\n\nprint("Earth:", escape_velocity(5.972e24, 6.371e6))\nprint("Mars:", escape_velocity(6.417e23, 3.3895e6))',explain:"Earth's larger mass gives it substantially higher escape velocity despite Mars's smaller radius."},
{id:"sp2",title:"Delta-v Budget Check",diff:"Scientist",topic:"rocket equation",prompt:"Using Δv = Isp·g0·ln(m0/m1), check whether a rocket with Isp=311s, wet mass 30000kg, dry mass 6000kg can achieve 9400 m/s needed for LEO.",hint:"Compute delta_v with the given values, then compare to 9400.",solution:'import math\ndef delta_v(isp, m0, m1, g0=9.80665):\n    return isp * g0 * math.log(m0/m1)\n\ndv = delta_v(311, 30000, 6000)\nprint(dv, dv >= 9400)',explain:"This checks a real mission-design question: does the rocket's fuel fraction and engine efficiency supply enough delta-v?"},
{id:"sp3",title:"Two-Stage Rocket Delta-v",diff:"Scientist",topic:"rocket equation",prompt:"Compute the total delta-v of a two-stage rocket by summing the delta-v contributed by each stage separately.",hint:"Call your delta_v function once per stage and add the results — this is why staging helps.",solution:'import math\ndef delta_v(isp, m0, m1, g0=9.80665):\n    return isp * g0 * math.log(m0/m1)\n\nstage1 = delta_v(280, 50000, 12000)\nstage2 = delta_v(320, 10000, 2500)\nprint("Total:", stage1 + stage2)',explain:"Staging lets a rocket discard dead mass (empty tanks) between burns, achieving more total delta-v than a single stage could."},
{id:"sp4",title:"Transit Depth Comparison",diff:"Explorer",topic:"exoplanets",prompt:"Compare the transit depth of a Jupiter-sized planet vs. an Earth-sized planet around a Sun-sized star.",hint:"depth = (r_planet/r_star)^2 — use consistent units (e.g., km) for both radii.",solution:'def transit_depth(r_planet_km, r_star_km):\n    return (r_planet_km / r_star_km) ** 2\n\nr_star = 696000\nprint("Jupiter:", transit_depth(69911, r_star))\nprint("Earth:", transit_depth(6371, r_star))',explain:"Jupiter-sized planets cause a far deeper (easier to detect) dip than Earth-sized ones — why early transit surveys found giants first."},
{id:"sp5",title:"Orbital Velocity at Multiple Altitudes",diff:"Explorer",topic:"orbital mechanics",prompt:"Compute Earth's circular orbital velocity at three altitudes: 200km, 400km (ISS-like), and 35786km (geostationary), added to Earth's radius.",hint:"Total orbital radius = Earth's radius + altitude.",solution:'import math\ndef orbital_velocity(mass_kg, radius_m, G=6.674e-11):\n    return math.sqrt(G * mass_kg / radius_m)\n\nearth_r = 6.371e6\nfor alt_km in [200, 400, 35786]:\n    r = earth_r + alt_km*1000\n    print(alt_km, orbital_velocity(5.972e24, r))',explain:"Orbital velocity decreases with altitude — geostationary satellites move far slower than low-orbit ones like the ISS."},
{id:"sp6",title:"Schwarzschild Radius Series",diff:"Scientist",topic:"black holes",prompt:"Compute the Schwarzschild radius for black holes of 1, 10, and 1,000,000 solar masses.",hint:"Rs = 2GM/c^2 scales linearly with mass.",solution:'def schwarzschild_radius(mass_kg, G=6.674e-11, c=2.998e8):\n    return 2 * G * mass_kg / c**2\n\nsolar_mass = 1.989e30\nfor multiple in [1, 10, 1_000_000]:\n    print(multiple, schwarzschild_radius(multiple * solar_mass), "m")',explain:"Because the relationship is linear in mass, a supermassive black hole's event horizon scales up proportionally."},
{id:"sp7",title:"Habitable Zone Distance Estimate",diff:"Scientist",topic:"habitability",prompt:"Implement a simplified habitable-zone inner/outer boundary estimate: d = sqrt(L / S), where L is stellar luminosity (solar units) and S is a solar flux threshold (0.25 to 1.5 for a rough zone).",hint:"Compute d for both S=1.5 (inner) and S=0.25 (outer).",solution:'import math\ndef hz_distance(luminosity_solar, flux_threshold):\n    return math.sqrt(luminosity_solar / flux_threshold)\n\nL = 1.0\nprint("Inner (AU):", hz_distance(L, 1.5))\nprint("Outer (AU):", hz_distance(L, 0.25))',explain:"This is a widely used simplified approximation; real habitable-zone models also account for atmospheric greenhouse effects."},
{id:"sp8",title:"Satellite Orbital Period from Altitude",diff:"Explorer",topic:"orbital mechanics",prompt:"Compute the orbital period of a satellite at 550km altitude around Earth, in minutes.",hint:"Use Kepler's third law with r = Earth's radius + altitude, then convert seconds to minutes.",solution:'import math\ndef period(mass_kg, r_m, G=6.674e-11):\n    return 2 * math.pi * math.sqrt(r_m**3 / (G*mass_kg))\n\nr = 6.371e6 + 550000\nT = period(5.972e24, r)\nprint(T/60, "minutes")',explain:"Most low-Earth-orbit satellites (like Starlink) complete an orbit roughly every 90-95 minutes."},
{id:"sp9",title:"Mars Mission Fuel Estimate",diff:"Engineer",topic:"mission planning",prompt:"Given a required delta-v of 3800 m/s (simplified trans-Mars injection) and Isp=340s, compute the required mass ratio m0/m1.",hint:"Rearrange the rocket equation: m0/m1 = exp(delta_v / (Isp*g0)).",solution:'import math\ndef required_mass_ratio(delta_v, isp, g0=9.80665):\n    return math.exp(delta_v / (isp * g0))\n\nprint(required_mass_ratio(3800, 340))',explain:"This tells mission designers how many times heavier the fueled rocket must be than its unfueled (dry) mass."},
{id:"sp10",title:"Compare Planetary Escape Velocities",diff:"Scientist",topic:"escape velocity",prompt:"Loop over a dictionary of planet name -> (mass_kg, radius_m) and print each planet's escape velocity in km/s.",hint:"Unpack each tuple value while looping with .items().",solution:'import math\ndef escape_velocity(mass_kg, radius_m, G=6.674e-11):\n    return math.sqrt(2*G*mass_kg/radius_m)\n\nplanets = {\n  "Earth": (5.972e24, 6.371e6),\n  "Mars": (6.417e23, 3.3895e6),\n  "Jupiter": (1.898e27, 6.9911e7)\n}\nfor name, (m, r) in planets.items():\n    print(name, escape_velocity(m, r)/1000, "km/s")',explain:"Jupiter's escape velocity is far higher than Earth's or Mars's, reflecting its much greater mass."}
]

{id:"f5",name:"Stefan-Boltzmann Law",cat:"Stellar Physics",eq:"L = 4πR²σT⁴",vars:"L=luminosity (W), R=radius (m), σ=5.670×10⁻⁸ W/m²K⁴, T=temperature (K)",meaning:"A star's total power output depends on its surface area and the fourth power of its temperature.",python:"import math\ndef luminosity(radius_m, temp_k, sigma=5.670374e-8):\n    return 4*math.pi*radius_m**2*sigma*temp_k**4",space:"Lets astronomers estimate a star's physical size from its temperature and observed brightness."},

{id:"f11",name:"Transit Depth",cat:"Exoplanets",eq:"depth = (Rp / R★)²",vars:"Rp=planet radius, R★=star radius (same units)",meaning:"The fractional dip in a star's brightness caused by a transiting planet.",python:"def transit_depth(r_planet, r_star):\n    return (r_planet / r_star) ** 2",space:"The core measurement behind the transit method of exoplanet discovery (Kepler, TESS)."},

{id:"f14",name:"Apparent → Absolute Magnitude",cat:"Stellar Photometry",eq:"M = m − 5·log₁₀(d/10)",vars:"M=absolute magnitude, m=apparent magnitude, d=distance (parsecs)",meaning:"Standardizes brightness as though every star were viewed from the same 10-parsec distance.",python:"import math\ndef absolute_magnitude(m, d_pc):\n    return m - 5*math.log10(d_pc/10)",space:"Lets astronomers compare the true luminosities of stars at very different distances."},

{id:"f16",name:"Gravitational Time Dilation (weak field)",cat:"Relativity",eq:"Δt' ≈ Δt·(1 − GM/rc²)",vars:"Δt'=dilated time interval, Δt=coordinate time interval, r=radial distance from mass",meaning:"Clocks tick slightly slower closer to a massive body — a simplified weak-field approximation.",python:"def dilated_interval(delta_t, mass_kg, r_m, G=6.674e-11, c=2.998e8):\n    return delta_t * (1 - G*mass_kg/(r_m*c**2))",space:"GPS satellites must correct for exactly this effect to keep accurate time relative to Earth's surface."},

/* ---------------- line joining & comment/string-aware scan ---------------- */
function scanLine(raw){
  let inStr=false, quote='', code='', i=0, esc=false, fstr=false;
  let delta=0;
  while(i<raw.length){
    const ch=raw[i];
    if(inStr){
      code+=ch;
      if(esc){esc=false;}
      else if(ch==='\\'){esc=true;}
      else if(ch===quote){inStr=false;}
      i++; continue;
    }
    if(ch==='#'){ break; }
    if(ch==='"'||ch==="'"){
      inStr=true; quote=ch; code+=ch; i++; continue;
    }
    if("([{".includes(ch)) delta++;
    if(")]}".includes(ch)) delta--;
    code+=ch; i++;
  }
  const trimmedRight=code.replace(/\s+$/,'');
  const backslashCont = /\\\s*$/.test(trimmedRight) && !inStr;
  const codeNoCont = backslashCont ? trimmedRight.replace(/\\\s*$/,'') : trimmedRight;
  return {code:codeNoCont, delta, cont:backslashCont};
}

function toLogicalLines(source){
  const rawLines = source.replace(/\r\n/g,'\n').split('\n');
  const out=[]; let buf='', bufIndent=null, bufLine=0, depth=0;
  for(let i=0;i<rawLines.length;i++){
    const raw = rawLines[i];
    const {code, delta, cont} = scanLine(raw);
    if(buf===''){
      const m = raw.match(/^[ \t]*/)[0];
      const indent = m.replace(/\t/g,'    ').length;
      const content = code.slice(m.length);
      if(content.trim()===''){ continue; }
      bufIndent=indent; buf=content; bufLine=i+1;
    } else {
      buf += ' ' + code.trim();
    }
    depth += delta;
    if(depth<=0 && !cont){
      if(buf.trim()!=='') out.push({indent:bufIndent, text:buf.trim(), line:bufLine});
      buf=''; depth=0;
    }
  }
  if(buf.trim()!=='') out.push({indent:bufIndent, text:buf.trim(), line:bufLine});
  return out;
}

function buildBlocks(logicalLines){
  const root = {indent:-1, children:[]};
  const stack=[root];
  for(const ll of logicalLines){
    while(ll.indent <= stack[stack.length-1].indent) stack.pop();
    const node = {indent:ll.indent, text:ll.text, line:ll.line, children:[]};
    stack[stack.length-1].children.push(node);
    stack.push(node);
  }
  return root.children;
}

/* ---------------- tokenizer for one statement's text ---------------- */
function tokenize(text, lineNo){
  const toks=[]; let i=0; const n=text.length;
  const isDigit=c=>c>='0'&&c<='9';
  const isIdStart=c=>/[A-Za-z_]/.test(c);
  const isIdPart=c=>/[A-Za-z0-9_]/.test(c);
  while(i<n){
    const c=text[i];
    if(c===' '||c==='\t'){i++;continue;}
    if(c==='"'||c==="'"){
      // check for f-string prefix already consumed by caller (handled below via lookback)
      const quote=c; let j=i+1; let str=''; let esc=false;
      while(j<n){
        const cc=text[j];
        if(esc){str+=cc;esc=false;j++;continue;}
        if(cc==='\\'){esc=true;j++;continue;}
        if(cc===quote){j++;break;}
        str+=cc; j++;
      }
      toks.push({t:'STR', v:str, line:lineNo});
      i=j; continue;
    }
    if(isIdStart(c)){
      let j=i+1; while(j<n && isIdPart(text[j])) j++;
      const word=text.slice(i,j);
      if((word==='f'||word==='r'||word==='rf'||word==='fr') && (text[j]==='"'||text[j]==="'")){
        const quote=text[j]; let k=j+1; let str=''; let esc=false;
        while(k<n){
          const cc=text[k];
          if(esc){str+=cc;esc=false;k++;continue;}
          if(cc==='\\'){esc=true;k++;continue;}
          if(cc===quote){k++;break;}
          str+=cc; k++;
        }
        toks.push({t:'FSTR', v:str, line:lineNo});
        i=k; continue;
      }
      if(KEYWORDS.has(word)) toks.push({t:'KW', v:word, line:lineNo});
      else toks.push({t:'ID', v:word, line:lineNo});
      i=j; continue;
    }
    if(isDigit(c) || (c==='.' && isDigit(text[i+1]))){
      let j=i; let isFloat=false;
      while(j<n && (isDigit(text[j])||text[j]==='_')) j++;
      if(text[j]==='.'){ isFloat=true; j++; while(j<n && (isDigit(text[j])||text[j]==='_')) j++; }
      if(text[j]==='e'||text[j]==='E'){
        let k=j+1;
        if(text[k]==='+'||text[k]==='-') k++;
        if(isDigit(text[k])){
          isFloat=true; j=k; while(j<n && isDigit(text[j])) j++;
        }
      }
      const raw=text.slice(i,j).replace(/_/g,'');
      toks.push({t:'NUM', v:parseFloat(raw), isFloat, line:lineNo});
      i=j; continue;
    }
    // multi-char operators
    const three = text.slice(i,i+3);
    const two = text.slice(i,i+2);
    if(['**=','//='].includes(three)){toks.push({t:'OP',v:three,line:lineNo}); i+=3; continue;}
    if(['**','//','==','!=','<=','>=','+=','-=','*=','/=','%=','->'].includes(two)){
      toks.push({t:'OP',v:two,line:lineNo}); i+=2; continue;
    }
    if('()[]{}:,.=+-*/%<>'.includes(c)){
      toks.push({t:'OP',v:c,line:lineNo}); i++; continue;
    }
    i++; // skip unknown char
  }
  toks.push({t:'EOF', line:lineNo});
  return toks;
}

/* ---------------- expression AST parser (Pratt) ---------------- */
function parseExprTokens(toks){

  function parseAtom(){
    const p=peek();
    if(p.t==='NUM'){next(); return {k:'Num', v:p.v, isFloat:p.isFloat};}
    if(p.t==='STR'){next(); return {k:'Str', v:p.v};}
    if(p.t==='FSTR'){next(); return {k:'FStr', v:p.v};}
    if(p.t==='KW' && p.v==='True'){next(); return {k:'Bool', v:true};}
    if(p.t==='KW' && p.v==='False'){next(); return {k:'Bool', v:false};}
    if(p.t==='KW' && p.v==='None'){next(); return {k:'None'};}

      next();

      while(!check('OP',':')){

        if(check('OP','=')){ next(); def=parseTernaryLike(); }
        params.push({name,def});
        if(check('OP',',')) next(); else break;
      }
      eat('OP',':');
      const body=parseOr();
      return {k:'Lambda', params, body};
    }
    if(p.t==='KW' && p.v==='not'){ next(); return {k:'Unary', op:'not', arg:parseNot()}; }
    if(p.t==='OP' && p.v==='-'){ next(); return {k:'Unary', op:'-', arg:parseUnary()}; }
    if(p.t==='OP' && p.v==='+'){ next(); return {k:'Unary', op:'+', arg:parseUnary()}; }
    if(p.t==='ID'){ next(); return {k:'Name', name:p.v}; }
    if(p.t==='OP' && p.v==='('){
      next();
      if(check('OP',')')){ next(); return {k:'Tuple', items:[]}; }
      const first=parseTernaryLike();
      if(check('OP',',')){
        const items=[first];
        while(check('OP',',')){ next(); if(check('OP',')')) break; items.push(parseTernaryLike()); }
        eat('OP',')');
        return {k:'Tuple', items};
      }
      eat('OP',')');
      return first;
    }
    if(p.t==='OP' && p.v==='['){
      next();
      if(check('OP',']')){ next(); return {k:'List', items:[]}; }
      const first=parseTernaryLike();
      if(check('KW','for')){

        eat('OP',']');
        return {k:'ListComp', expr:first, clauses};
      }
      const items=[first];
      while(check('OP',',')){ next(); if(check('OP',']')) break; items.push(parseTernaryLike()); }
      eat('OP',']');
      return {k:'List', items};
    }
    if(p.t==='OP' && p.v==='{'){

      if(check('OP','}')){ next(); return {k:'Dict', items:[]}; }

      if(check('OP',':')){

        while(check('OP',',')){ next(); if(check('OP','}')) break; const k2=parseTernaryLike(); eat('OP',':'); const v2=parseTernaryLike(); items.push([k2,v2]); }
        eat('OP','}');
        return {k:'Dict', items};
      } else {
        if(check('KW','for')){
          const clauses=parseCompClauses();
          eat('OP','}');
          return {k:'SetComp', expr:firstKey, clauses};
        }
        const items=[firstKey];
        while(check('OP',',')){ next(); if(check('OP','}')) break; items.push(parseTernaryLike()); }

        return {k:'Set', items};

  }
  function parsePostfix(){
    let node=parseAtom();
    for(;;){
      if(check('OP','.')){

      } else if(check('OP','(')){
        next();
        const args=[]; const kwargs=[];
        while(!check('OP',')')){
          if(peek().t==='ID' && toks[pos+1] && toks[pos+1].t==='OP' && toks[pos+1].v==='=' ){
            const name=eat('ID').v; eat('OP','='); const val=parseTernaryLike(); kwargs.push({name,val});
          } else if(check('OP','**')){
            next(); const val=parseTernaryLike(); kwargs.push({spreadDict:true, val});
          } else if(check('OP','*')){
            next(); const val=parseTernaryLike(); args.push({spread:true, val});
          } else {
            const val=parseTernaryLike();
            if(check('KW','for')){
              const clauses=parseCompClauses();
              args.push({spread:false, val:{k:'ListComp', expr:val, clauses}});
              break;
            }
            args.push({spread:false, val});
          }
          if(check('OP',',')) next(); else break;
        }
        eat('OP',')');

      } else if(check('OP','[')){
        next();
        let lower=null, upper=null, step=null, isSlice=false;
        if(!check('OP',':')) lower=parseTernaryLike();
        if(check('OP',':')){

  }
  function parseUnary(){
    if(check('OP','-')){ next(); return {k:'Unary', op:'-', arg:parseUnary()}; }

    return base;
  }
  function parseTerm(){
    let node=parsePower();
    while(check('OP','*')||check('OP','/')||check('OP','//')||check('OP','%')){

    }
    return node;
  }
  function parseArith(){
    let node=parseTerm();

      const op=next().v; node={k:'Bin', op, l:node, r:parseTerm()};
    }
    return node;
  }

    let node=parseArith();
    const cmpOps=['==','!=','<','>','<=','>='];
    for(;;){
      if(peek().t==='OP' && cmpOps.includes(peek().v)){
        const op=next().v; node={k:'Compare', op, l:node, r:parseArith()};
      } else if(check('KW','in')){
        next(); node={k:'Compare', op:'in', l:node, r:parseArith()};
      } else if(check('KW','not') && toks[pos+1] && toks[pos+1].v==='in'){
        next(); next(); node={k:'Compare', op:'not in', l:node, r:parseArith()};
      } else if(check('KW','is')){
        next(); let op='is';
        if(check('KW','not')){ next(); op='is not'; }
        node={k:'Compare', op, l:node, r:parseArith()};
      } else break;
    }
    return node;
  }
  function parseNot(){
    if(check('KW','not')){ next(); return {k:'Unary', op:'not', arg:parseNot()}; }
    return parseComparison();
  }
  function parseAnd(){
    let node=parseNot();
    while(check('KW','and')){ next(); node={k:'Bool', op:'and', l:node, r:parseNot()}; }
    return node;
  }
  function parseOr(){
    let node=parseAnd();
    while(check('KW','or')){ next(); node={k:'Bool', op:'or', l:node, r:parseAnd()}; }
    return node;
  }
  function parseTernaryLike(){
    const node=parseOr();
    if(check('KW','if')){
      next(); const cond=parseOr(); eat('KW','else'); const other=parseTernaryLike();
      return {k:'IfExp', cond, then:node, other};
    }
    return node;
  }
  function parseFull(){
    if(check('EOF')) return null;
    const first=parseTernaryLike();
    if(check('OP',',')){
      const items=[first];
      while(check('OP',',')){ next(); if(check('EOF')) break; items.push(parseTernaryLike()); }
      return {k:'Tuple', items};
    }
    return first;
  }
  const result = parseFull();
  return {node:result, pos, toks};
}
function parseExpr(text, lineNo){
  const toks=tokenize(text, lineNo);
  const {node}=parseExprTokens(toks);
  return node;
}

/* ---------------- statement parser ---------------- */
function splitTopLevel(text, sep){
  // split text by sep character at bracket-depth 0 and not inside quotes
  const parts=[]; let depth=0, cur='', inStr=false, q='';
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(inStr){ cur+=c; if(c===q && text[i-1]!=='\\') inStr=false; continue; }
    if(c==='"'||c==="'"){ inStr=true; q=c; cur+=c; continue; }
    if('([{'.includes(c)) depth++;
    if(')]}'.includes(c)) depth--;
    if(c===sep && depth===0){ parts.push(cur); cur=''; continue; }
    cur+=c;
  }
  parts.push(cur);
  return parts;
}
function findTopLevel(text, word){
  // find index of a standalone keyword at depth 0 outside strings
  let depth=0, inStr=false, q='';
  const re=new RegExp('\\b'+word+'\\b');
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(inStr){ if(c===q && text[i-1]!=='\\') inStr=false; continue; }
    if(c==='"'||c==="'"){ inStr=true; q=c; continue; }
    if('([{'.includes(c)) depth++;
    if(')]}'.includes(c)) depth--;
    if(depth===0){
      const rest=text.slice(i);
      const m=rest.match(new RegExp('^'+word+'\\b'));
      if(m && (i===0 || /[^A-Za-z0-9_]/.test(text[i-1]))) return i;
    }
  }
  return -1;
}

function parseTarget(text){
  const parts = splitTopLevel(text, ',').map(s=>s.trim()).filter(s=>s!=='');
  if(parts.length===1) return parseExpr(parts[0], 0);
  return {k:'Tuple', items: parts.map(p=>parseExpr(p,0))};
}

function parseParamList(text){
  const params=[];
  const parts = splitTopLevel(text, ',').map(s=>s.trim()).filter(s=>s!=='');
  for(const p of parts){
    if(p.startsWith('**')) params.push({name:p.slice(2).split(':')[0].trim(), kind:'kwargs'});
    else if(p.startsWith('*')) params.push({name:p.slice(1).split(':')[0].trim(), kind:'args'});
    else {
      let namePart=p, def=null;
      const eqIdx = splitTopLevel(p,'=').length>1 ? p.indexOf('=') : -1;
      if(eqIdx>-1){ namePart=p.slice(0,eqIdx).trim(); def=p.slice(eqIdx+1).trim(); }
      const name = namePart.split(':')[0].trim();
      params.push({name, kind:'pos', def: def!==null ? parseExpr(def,0): null});
    }
  }
  return params;
}

function parseArgsCallText(text){
  // used for decorator args (rare) - not heavily needed
  return parseExpr(text,0);
}

function containsYield(stmts){
  for(const s of stmts){
    if(!s) continue;
    if(s.k==='Yield') return true;
    if(s.k==='If'){ if(containsYield(s.then)||containsYield(s.orelse)) return true; }
    if(s.k==='For'||s.k==='While'){ if(containsYield(s.body)) return true; }
    if(s.k==='Try'){ if(containsYield(s.body)) return true; for(const h of (s.handlers||[])) if(containsYield(h.body)) return true; if(containsYield(s.finallyBody)) return true; }
    if(s.k==='With'){ if(containsYield(s.body)) return true; }
  }
  return false;
}
function parseStatement(node){

    return {k:'Pass'};
  }
  if(text==='yield') return {k:'Yield', value:null};
  if(text.startsWith('yield ')) return {k:'Yield', value:parseExpr(text.slice(6), node.line)};
  if(text==='pass') return {k:'Pass'};
  if(text==='break') return {k:'Break'};
  if(text==='continue') return {k:'Continue'};
  if(text==='return' ) return {k:'Return', value:null};
  if(text.startsWith('return ')) return {k:'Return', value:parseExpr(text.slice(7),node.line)};
  if(text.startsWith('return(')) return {k:'Return', value:parseExpr(text.slice(6),node.line)};
  if(text.startsWith('raise')){
    const rest=text.slice(5).trim();
    return {k:'Raise', expr: rest? parseExpr(rest,node.line): null};
  }
  if(text.startsWith('global ')) return {k:'Pass'};
  if(text.startsWith('import ')){
    const mods = splitTopLevel(text.slice(7),',').map(s=>s.trim());
    return {k:'Import', modules: mods.map(m=>{ const asIdx=m.split(/\s+as\s+/); return {name:asIdx[0].trim(), alias: asIdx[1]?asIdx[1].trim():asIdx[0].trim().split('.')[0]}; })};
  }
  if(text.startsWith('from ')){
    const m = text.match(/^from\s+([\w.]+)\s+import\s+(.+)$/);
    if(m){
      const mod=m[1];

        const parts=s.split(/\s+as\s+/); return {name:parts[0].trim(), alias:parts[1]?parts[1].trim():parts[0].trim()};

    }
    return {k:'Pass'};
  }
  if(text.startsWith('def ')){
    const m=text.match(/^def\s+([A-Za-z_]\w*)\s*\(([\s\S]*)\)\s*(->\s*[\w\[\],. ]+)?:$/);
    if(!m) throw new PyError('SyntaxError','invalid function definition: '+text);
    const params = parseParamList(m[2]);
    const body = parseBlock(node.children);
    return {k:'FuncDef', name:m[1], params, body, decorators:[], isGenerator: containsYield(body)};
  }
  if(text.startsWith('class ')){
    const m=text.match(/^class\s+([A-Za-z_]\w*)\s*(\(([^)]*)\))?\s*:$/);
    if(!m) throw new PyError('SyntaxError','invalid class definition: '+text);
    const bases = m[3] ? splitTopLevel(m[3],',').map(s=>s.trim()).filter(Boolean) : [];
    const bodyStmts=[];
    const fields=[];
    for(const child of node.children){
      const fm = child.text.match(/^([A-Za-z_]\w*)\s*:\s*[\w\[\],\. ]+$/);
      if(fm && !child.text.startsWith('def')){
        fields.push(fm[1]);
        continue;
      }
      bodyStmts.push(child);
    }
    const body = parseBlock(bodyStmts);
    return {k:'ClassDef', name:m[1], bases, body, fields, decorators:[]};
  }
  if(text.startsWith('if ') && text.endsWith(':')){
    return parseIfChain(node);
  }
  if(text.startsWith('while ') && text.endsWith(':')){
    const cond=parseExpr(text.slice(6,-1), node.line);
    return {k:'While', cond, body:parseBlock(node.children)};
  }
  if(text.startsWith('for ') && text.endsWith(':')){
    const m = text.match(/^for\s+(.+?)\s+in\s+(.+):$/);
    if(!m) throw new PyError('SyntaxError','invalid for statement: '+text);
    const target=parseTarget(m[1]);
    const iter=parseExpr(m[2], node.line);
    return {k:'For', target, iter, body:parseBlock(node.children)};
  }
  if(text.startsWith('try') && text.endsWith(':')){
    return parseTryChain(node);
  }
  if(text.startsWith('with ') && text.endsWith(':')){
    const m=text.match(/^with\s+(.+?)(?:\s+as\s+([A-Za-z_]\w*))?:$/);
    const expr=parseExpr(m[1], node.line);
    return {k:'With', expr, name:m[2]||null, body:parseBlock(node.children)};
  }
  // augmented assignment
  for(const aop of ['+=','-=','*=','/=','//=','%=','**=']){
    const idx = findTopLevelOp(text, aop);
    if(idx>-1){
      const lhs=text.slice(0,idx).trim();
      const rhs=text.slice(idx+aop.length).trim();
      return {k:'AugAssign', op:aop.slice(0,-1), target:parseExpr(lhs,node.line), value:parseExpr(rhs,node.line)};
    }
  }
  // plain assignment (single '=' at depth0, not == )
  const eqIdx = findTopLevelEquals(text);
  if(eqIdx>-1){
    const lhs=text.slice(0,eqIdx).trim();
    const rhs=text.slice(eqIdx+1).trim();
    // support chained assignment a = b = expr (rare) -> just handle single target for simplicity
    return {k:'Assign', target:parseTarget(lhs), value:parseExpr(rhs,node.line)};
  }
  // expression statement (e.g., a call like print(...))
  return {k:'ExprStmt', expr:parseExpr(text,node.line)};
}
function findTopLevelOp(text, op){
  let depth=0, inStr=false, q='';
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(inStr){ if(c===q && text[i-1]!=='\\') inStr=false; continue; }
    if(c==='"'||c==="'"){ inStr=true; q=c; continue; }
    if('([{'.includes(c)) depth++;
    if(')]}'.includes(c)) depth--;
    if(depth===0 && text.slice(i,i+op.length)===op) return i;
  }
  return -1;
}
function findTopLevelEquals(text){
  let depth=0, inStr=false, q='';
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(inStr){ if(c===q && text[i-1]!=='\\') inStr=false; continue; }
    if(c==='"'||c==="'"){ inStr=true; q=c; continue; }
    if('([{'.includes(c)) depth++;
    if(')]}'.includes(c)) depth--;
    if(depth===0 && c==='=' && text[i+1]!=='=' && text[i-1]!=='=' && text[i-1]!=='!' && text[i-1]!=='<' && text[i-1]!=='>' && text[i-1]!=='+' && text[i-1]!=='-' && text[i-1]!=='*' && text[i-1]!=='/' && text[i-1]!=='%') return i;

}
function parseBlock(childNodes){
  const stmts=[];

function touchStreak(){
  const today = new Date().toISOString().slice(0,10);
  if(STATE.streak.lastDate === today) return;
  const y = new Date(Date.now()-86400000).toISOString().slice(0,10);
  STATE.streak.count = (STATE.streak.lastDate===y) ? STATE.streak.count+1 : 1;
  STATE.streak.lastDate = today;
  saveState();
}

function markChallengeDone(id){ if(!STATE.completedChallenges.includes(id)){ STATE.completedChallenges.push(id); touchStreak(); saveState(); } }

function esc(s){ return String(s===undefined||s===null?'':s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function highlightPy(code){
  return esc(code)
    .replace(/(#.*)$/gm,'<span class="c-com">$1</span>')
    .replace(/(&quot;.*?&quot;|'[^']*')/g,'<span class="c-str">$1</span>')
    .replace(/\b(def|return|if|elif|else|for|while|in|import|from|as|class|try|except|finally|with|lambda|break|continue|pass|True|False|None|and|or|not|raise|yield|self|super)\b/g,'<span class="c-kw">$1</span>')
    .replace(/\b(\d+\.?\d*(e[-+]?\d+)?)\b/g,'<span class="c-num">$1</span>');
}
function codeBlock(code, label){
  const id = 'cb'+Math.random().toString(36).slice(2,9);
  return `<div class="code-label"><span>${esc(label||'PYTHON')}</span><button class="copy-btn" data-action="copy-code" data-target="${id}">Copy</button></div>

}

function onSearchInput(e){
  const q = e.target.value.trim().toLowerCase();

  const idx = getSearchIndex();

  if(!matches.length){ box.innerHTML = `<div class="sr-item">No results for "${esc(q)}"</div>`; box.classList.add('show'); return; }
  const byType = {};
  matches.forEach(m=>{ (byType[m.type]=byType[m.type]||[]).push(m); });

    html += `<div class="sr-group">${esc(t.toUpperCase())}</div>`;

      html += `<div class="sr-item" data-action="nav" data-hash="${m.go}">${esc(m.title)}<small>${esc(m.sub||'')}</small></div>`;
    });
  }

}

/* ---------------- STARFIELD ---------------- */
function initStarfield(){
  const container = document.getElementById('starfield');
  const canvas = document.createElement('canvas');
  container.appendChild(canvas);
  const ctx = canvas.getContext('2d');
  let stars=[];
  function resize(){
    canvas.width = window.innerWidth; canvas.height = window.innerHeight;
    const n = Math.min(180, Math.floor((canvas.width*canvas.height)/9000));
    stars = Array.from({length:n}, ()=>({x:Math.random()*canvas.width, y:Math.random()*canvas.height, r:Math.random()*1.3+0.2, a:Math.random()*0.6+0.2}));
  }
  function draw(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    ctx.fillStyle='#fff';
    for(const s of stars){ ctx.globalAlpha=s.a; ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,7); ctx.fill(); }
    ctx.globalAlpha=1;
  }
  window.addEventListener('resize', ()=>{resize(); draw();});
  resize(); draw();
}

document.addEventListener('click', function(ev){
  const t = ev.target.closest('[data-action]');
  if(!t) return;
  const action = t.dataset.action;
  switch(action){
    case 'nav': navigate(t.dataset.hash); break;
    case 'toggle-sidebar': document.getElementById('sidebar').classList.toggle('open'); document.getElementById('scrim').classList.toggle('show'); break;
    case 'close-sidebar': document.getElementById('sidebar').classList.remove('open'); document.getElementById('scrim').classList.remove('show'); break;
    case 'copy-code': {
      const target = document.getElementById(t.dataset.target);
      const raw = decodeURIComponent(target.dataset.raw);
      navigator.clipboard && navigator.clipboard.writeText(raw).catch(()=>{});
      t.textContent='Copied!'; setTimeout(()=>t.textContent='Copy', 1200);
      break;
    }
    case 'quiz-answer': handleQuizAnswer(t); break;
    case 'mark-lesson-done': { markLessonDone(t.dataset.id); renderRoute(); break; }
    case 'toc-jump': { document.getElementById(t.dataset.target).scrollIntoView({behavior:'smooth', block:'start'}); break; }
    case 'reveal-exercise': { /* handled by <details> native toggle */ break; }
    case 'mark-exercise-done': { markExerciseDone(t.dataset.id); renderRoute(); break; }
    case 'mark-challenge-done': { markChallengeDone(t.dataset.id); renderRoute(); break; }
    case 'mark-project-done': { markProjectDone(t.dataset.id); renderRoute(); break; }
    case 'toggle-mission-obj': { toggleMissionObj(t.dataset.id); renderRoute(); break; }
    case 'run-playground': runPlaygroundCode(); break;
    case 'clear-playground': document.getElementById('pg-editor').value=''; document.getElementById('pg-output').textContent=''; break;
    case 'load-example': loadPlaygroundExample(t.dataset.code); break;
    case 'reset-progress': {
      if(confirm('Reset all saved progress? This cannot be undone.')){
        ['completedLessons','completedExercises','completedChallenges','completedProjects','missionObjectives','quizScores','streak'].forEach(k=>localStorage.removeItem(LS_PREFIX+k));
        location.reload();
      }
      break;
    }
    case 'gen-certificate': genCertificate(t.dataset.level); break;
    case 'view-certificate': {
      const c = CERT_LEVELS.find(x=>x.id===t.dataset.level);
      const rec = lsGet('cert_'+t.dataset.level, null);
      if(c && rec) openCertificateModal(rec, c);
      break;
    }
    case 'close-cert-modal': closeCertModal(); break;
    case 'print-cert': window.print(); break;
    case 'save-learner-name': {
      const v = document.getElementById('cert-name-input').value.trim();
      if(v) setLearnerName(v);
      break;
    }
    case 'verify-certificate': handleVerifyCertificate(); break;
    case 'run-calc': runCalculator(t.dataset.calc); break;
    case 'run-unit-convert': runUnitConverter(); break;
    case 'filter-glossary': renderKnowledgeList(t.dataset.cat); break;
    case 'sim-select': renderSimulation(t.dataset.sim); break;
    case 'data-select': renderDataset(t.dataset.set); break;
  }
});

function handleQuizAnswer(el){
  const qBox = el.closest('.quiz-q');
  const correctIdx = parseInt(qBox.dataset.correct,10);
  const chosenIdx = parseInt(el.dataset.idx,10);
  qBox.querySelectorAll('.quiz-opt').forEach((o,i)=>{
    o.style.pointerEvents='none';
    if(i===correctIdx) o.classList.add('correct');
    else if(i===chosenIdx) o.classList.add('wrong');
  });
  const fb = qBox.querySelector('.quiz-fb');
  fb.classList.add('show');
  fb.classList.add(chosenIdx===correctIdx?'ok':'no');
  fb.textContent = (chosenIdx===correctIdx? 'Correct. ':'Not quite. ') + qBox.dataset.exp;
}

function fmtNum(n){
  if(!isFinite(n)) return String(n);
  if(Math.abs(n)>=1e6 || (Math.abs(n)<1e-3 && n!==0)) return n.toExponential(4);
  return (Math.round(n*10000)/10000).toString();
}

let simAnimHandle=null;
function stopSimAnim(){ if(simAnimHandle){ cancelAnimationFrame(simAnimHandle); simAnimHandle=null; } }
function renderSimulation(id){
  SIMS.forEach(s=>{ const b=document.getElementById('simbtn-'+s.id); if(b) b.classList.toggle('btn-primary', s.id===id); });
  stopSimAnim();
  const canvas = document.getElementById('sim-canvas');

  let ctx=null; try{ ctx = canvas.getContext('2d'); }catch(e){}
  if(!ctx){ controls.innerHTML=''; canvas.replaceWith(Object.assign(document.createElement('div'),{className:'empty-state',textContent:'Canvas rendering is not available in this browser context.'})); return; }
  if(id==='orbit2body') simOrbit2Body(canvas, ctx, controls);
  else if(id==='projectile') simProjectile(canvas, ctx, controls);
  else if(id==='blackbody') simBlackbody(canvas, ctx, controls);
  else if(id==='doppler') simDoppler(canvas, ctx, controls);
  else if(id==='starfield3d') simStarfield(canvas, ctx, controls);
}
function simOrbit2Body(canvas, ctx, controls){
  controls.innerHTML = `
   <div><label>Initial velocity factor (× circular)</label><input type="range" id="c-vel" min="0.5" max="1.6" step="0.02" value="1.0"><div class="sim-readout" id="r-vel"></div></div>
   <div><label>Orbital radius (×10⁷ m)</label><input type="range" id="c-radius" min="3" max="10" step="0.2" value="6"><div class="sim-readout" id="r-radius"></div></div>`;
  const massKg = 5.972e24, G=6.674e-11;
  let radius = 6e7, velFactor=1.0;
  let pos, vel, trail=[];
  function reset(){
    const circV = Math.sqrt(G*massKg/radius);
    pos = {x:radius, y:0};
    vel = {x:0, y:circV*velFactor};
    trail=[];
  }
  reset();
  document.getElementById('c-vel').addEventListener('input', e=>{ velFactor=parseFloat(e.target.value); reset(); });
  document.getElementById('c-radius').addEventListener('input', e=>{ radius=parseFloat(e.target.value)*1e7; reset(); });
  function step(dt){
    const r = Math.hypot(pos.x,pos.y);
    const a = G*massKg/(r*r);
    const ax=-a*pos.x/r, ay=-a*pos.y/r;
    vel.x+=ax*dt; vel.y+=ay*dt;
    pos.x+=vel.x*dt; pos.y+=vel.y*dt;
    trail.push({x:pos.x,y:pos.y}); if(trail.length>400) trail.shift();
  }
  function draw(){
    const w=canvas.width,h=canvas.height, scale=Math.min(w,h)/2/1.1e8;
    ctx.fillStyle='#000'; ctx.fillRect(0,0,w,h);
    const cx=w/2, cy=h/2;
    ctx.fillStyle='#ffffff'; ctx.beginPath(); ctx.arc(cx,cy,10,0,7); ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,0.35)';
    ctx.beginPath();
    trail.forEach((p,i)=>{ const x=cx+p.x*scale, y=cy+p.y*scale; if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y); });
    ctx.stroke();
    ctx.fillStyle='#c9c9c9';
    const x=cx+pos.x*scale, y=cy+pos.y*scale;
    ctx.beginPath(); ctx.arc(x,y,5,0,7); ctx.fill();
    document.getElementById('r-vel').textContent = velFactor.toFixed(2)+'× circular velocity';
    document.getElementById('r-radius').textContent = (radius/1e7).toFixed(1)+'×10⁷ m radius';
  }
  function loop(){ for(let i=0;i<8;i++) step(6); draw(); simAnimHandle=requestAnimationFrame(loop); }
  loop();
}
function simProjectile(canvas, ctx, controls){
  controls.innerHTML = `
   <div><label>Launch speed (m/s)</label><input type="range" id="c-speed" min="10" max="100" step="1" value="50"><div class="sim-readout" id="r-speed"></div></div>
   <div><label>Launch angle (°)</label><input type="range" id="c-angle" min="5" max="85" step="1" value="45"><div class="sim-readout" id="r-angle"></div></div>
   <div><label>Gravity (m/s², Earth=9.8)</label><input type="range" id="c-g" min="1.6" max="24.8" step="0.1" value="9.8"><div class="sim-readout" id="r-g"></div></div>`;
  let speed=50, angle=45, g=9.8, t=0;
  document.getElementById('c-speed').addEventListener('input', e=>{speed=parseFloat(e.target.value); t=0;});
  document.getElementById('c-angle').addEventListener('input', e=>{angle=parseFloat(e.target.value); t=0;});
  document.getElementById('c-g').addEventListener('input', e=>{g=parseFloat(e.target.value); t=0;});
  function draw(){
    const w=canvas.width,h=canvas.height;
    ctx.fillStyle='#000'; ctx.fillRect(0,0,w,h);
    const rad=angle*Math.PI/180;
    const vx=speed*Math.cos(rad), vy=speed*Math.sin(rad);
    const range = 2*vx*vy/g;
    const scale = Math.max(2, (w*0.8)/Math.max(range,1));
    ctx.strokeStyle='rgba(255,255,255,0.55)'; ctx.beginPath();
    for(let x=0;x<=range;x+=range/200){
      const time = x/vx; const y = vy*time - 0.5*g*time*time;
      const px = 40+x*scale, py = h-40-y*scale;
      if(x===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
    }
    ctx.stroke();
    t+=0.02;
    const curT = (t*Math.max(vx, 1)) % (range/vx || 1);
    const cx = 40+ (curT*vx)*scale, cy = h-40-(vy*curT-0.5*g*curT*curT)*scale;
    ctx.fillStyle='#c9c9c9'; ctx.beginPath(); ctx.arc(cx,cy,5,0,7); ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,0.15)'; ctx.beginPath(); ctx.moveTo(40,h-40); ctx.lineTo(w-20,h-40); ctx.stroke();
    document.getElementById('r-speed').textContent = speed+' m/s';
    document.getElementById('r-angle').textContent = angle+'°, range ≈ '+range.toFixed(1)+' m';
    document.getElementById('r-g').textContent = g+' m/s²';
  }
  function loop(){ draw(); simAnimHandle=requestAnimationFrame(loop); }
  loop();
}
function simBlackbody(canvas, ctx, controls){
  controls.innerHTML = `<div><label>Temperature (K)</label><input type="range" id="c-temp" min="1000" max="30000" step="100" value="5778"><div class="sim-readout" id="r-temp"></div></div>`;
  let temp=5778;
  document.getElementById('c-temp').addEventListener('input', e=>{temp=parseFloat(e.target.value);});
  function planck(lambda_nm, T){
    const h=6.626e-34,c=2.998e8,k=1.381e-23;
    const lambda = lambda_nm*1e-9;
    const a = 2*h*c*c/Math.pow(lambda,5);
    const b = Math.exp(h*c/(lambda*k*T))-1;
    return a/b;
  }
  function draw(){
    const w=canvas.width,h=canvas.height;
    ctx.fillStyle='#000'; ctx.fillRect(0,0,w,h);
    let maxVal=0; const vals=[];
    for(let nm=100; nm<=2500; nm+=10){ const v=planck(nm,temp); vals.push(v); if(v>maxVal) maxVal=v; }
    ctx.strokeStyle='#ffffff'; ctx.beginPath();
    vals.forEach((v,i)=>{
      const x = 40 + (i/(vals.length-1))*(w-70);
      const y = h-40 - (v/maxVal)*(h-70);
      if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
    });
    ctx.stroke();
    ctx.strokeStyle='rgba(255,255,255,0.15)'; ctx.beginPath(); ctx.moveTo(40,h-40); ctx.lineTo(w-20,h-40); ctx.stroke();
    const peakNm = 2.8977719e6/temp;
    ctx.fillStyle='#9a9a9a'; ctx.font='12px monospace';
    ctx.fillText('Wavelength (nm) →', w/2-60, h-15);
    ctx.fillText(`Peak ≈ ${peakNm.toFixed(0)} nm`, w-160, 30);
    document.getElementById('r-temp').textContent = temp+' K — peak wavelength ≈ '+peakNm.toFixed(0)+' nm';
  }
  function loop(){ draw(); simAnimHandle=requestAnimationFrame(loop); }
  loop();
}
function simDoppler(canvas, ctx, controls){
  controls.innerHTML = `<div><label>Radial velocity (km/s, + = receding)</label><input type="range" id="c-rv" min="-500" max="500" step="5" value="0"><div class="sim-readout" id="r-rv"></div></div>`;
  let rv=0;
  document.getElementById('c-rv').addEventListener('input', e=>{rv=parseFloat(e.target.value);});
  function draw(){
    const w=canvas.width,h=canvas.height;
    ctx.fillStyle='#000'; ctx.fillRect(0,0,w,h);
    const restLines=[430,486,656]; // nm, simplified hydrogen-like lines
    const c=299792.458;
    ctx.font='13px monospace';
    restLines.forEach((rest,i)=>{
      const shifted = rest*(1+rv/c);
      const y=90+i*140;
      ctx.fillStyle='#8a8a8a'; ctx.fillText(`Rest: ${rest} nm`, 40, y-20);
      const hue = wavelengthToHue(shifted);
      ctx.fillStyle=`hsl(${hue},80%,55%)`;
      ctx.fillRect(40, y, w-100, 26);
      ctx.fillStyle='#fff'; ctx.fillText(`Observed: ${shifted.toFixed(2)} nm`, 40, y+45);
    });
    document.getElementById('r-rv').textContent = rv+' km/s ('+(rv>0?'redshift / receding':(rv<0?'blueshift / approaching':'no shift'))+')';
  }
  function wavelengthToHue(nm){
    if(nm<440) return 270; if(nm<490) return 240; if(nm<510) return 200; if(nm<580) return 120; if(nm<645) return 50; return 0;
  }
  function loop(){ draw(); simAnimHandle=requestAnimationFrame(loop); }
  loop();
}
function simStarfield(canvas, ctx, controls){
  controls.innerHTML = `<div><label>Star count</label><input type="range" id="c-n" min="50" max="1000" step="10" value="300"><div class="sim-readout" id="r-n"></div></div>`;
  let n=300, stars=[];
  function gen(){ stars = Array.from({length:n},()=>({x:Math.random()*canvas.width,y:Math.random()*canvas.height,r:Math.random()*1.8+0.3,tw:Math.random()*Math.PI*2})); }
  gen();
  document.getElementById('c-n').addEventListener('input', e=>{n=parseInt(e.target.value,10); gen();});
  function draw(t){
    ctx.fillStyle='#000'; ctx.fillRect(0,0,canvas.width,canvas.height);
    stars.forEach(s=>{
      const a = 0.4+0.6*Math.abs(Math.sin(s.tw+t/600));
      ctx.globalAlpha=a; ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,7); ctx.fill();
    });
    ctx.globalAlpha=1;
    document.getElementById('r-n').textContent = n+' procedurally generated stars (illustrative, not a real star catalog)';
  }
  function loop(t){ draw(t||0); simAnimHandle=requestAnimationFrame(loop); }
  loop(0);
}

const UNIT_GROUPS = {
  length: {units:{m:1, km:1000, AU:1.495978707e11, 'light-year':9.4607e15, parsec:3.0857e16, mile:1609.34}, label:'Length / Distance'},
  mass: {units:{kg:1, 'solar mass':1.989e30, 'Earth mass':5.972e24, gram:0.001, lb:0.453592}, label:'Mass'},

function viewUnitLab(){
  document.getElementById('content').innerHTML = `
  <div class="view-head"><div class="eyebrow-path">Apply <b>/</b> Unit & Dimension Lab</div><h1>Unit & Dimension Lab</h1>
  <p class="lede">Dimensional analysis matters: a beautiful formula with the wrong units gives a meaningless number.</p></div>
  <div class="panel calc-card" style="max-width:520px;">
    <div class="calc-field"><label>Category</label>
      <select id="unit-cat">${Object.entries(UNIT_GROUPS).map(([k,g])=>`<option value="${k}">${esc(g.label)}</option>`).join('')}</select>
    </div>
    <div class="grid grid-2">
      <div class="calc-field"><label>From</label><select id="unit-from"></select></div>
      <div class="calc-field"><label>To</label><select id="unit-to"></select></div>
    </div>
    <div class="calc-field"><label>Value</label><input type="number" id="unit-value" value="1" step="any"></div>
    <button class="btn btn-primary btn-sm" data-action="run-unit-convert">Convert</button>
    <div id="unit-result"></div>
  </div>
  <div class="divider"></div>
  <div class="grid grid-2">
    <div class="card"><h3>Why this matters</h3><p>NASA's Mars Climate Orbiter (1999) was lost when one team's software used pound-seconds and another used newton-seconds for the same value, with no unit check between them.</p></div>
    <div class="card"><h3>Good practice</h3><p>Name variables with their units (radius_km, not just radius), and convert to SI units (meters, kilograms, seconds) at the boundary of your program before running physics formulas.</p></div>
  </div>
  `;
  const catSel = document.getElementById('unit-cat');
  function populate(){
    const g = UNIT_GROUPS[catSel.value];
    const opts = Object.keys(g.units).map(u=>`<option value="${u}">${u}</option>`).join('');
    document.getElementById('unit-from').innerHTML = opts;
    document.getElementById('unit-to').innerHTML = opts;
    document.getElementById('unit-to').selectedIndex = 1;
  }
  catSel.addEventListener('change', populate);
  populate();
}
function runUnitConverter(){
  const cat = document.getElementById('unit-cat').value;
  const g = UNIT_GROUPS[cat];
  const from = document.getElementById('unit-from').value;
  const to = document.getElementById('unit-to').value;
  const val = parseFloat(document.getElementById('unit-value').value);
  const base = val * g.units[from];
  const result = base / g.units[to];
  document.getElementById('unit-result').innerHTML = `<div class="calc-result"><div class="val">${fmtNum(result)} ${esc(to)}</div></div>`;
}

function simpleHash(str){
  let h = 5381;
  for(let i=0;i<str.length;i++){ h = ((h*33) ^ str.charCodeAt(i)) >>> 0; }
  return h.toString(16).toUpperCase().padStart(8,'0');
}
function certSignature(rec){
  return simpleHash(`${rec.id}|${rec.name}|${rec.course}|${rec.level}|${rec.date}|${CERT_SALT}`);
}
function prettyDate(iso){
  const d = new Date(iso+'T00:00:00');
  return d.toLocaleDateString('en-US', {month:'short', day:'numeric', year:'numeric'});
}
function nextCertId(){
  const seq = lsGet('certSeq', 0) + 1;
  lsSet('certSeq', seq);
  const year = new Date().getFullYear();
  return `XH-${year}-${String(seq).padStart(4,'0')}`;
}
function getLearnerName(){ return lsGet('learnerName', ''); }
function setLearnerName(n){ lsSet('learnerName', n); }
function certVerifyUrl(rec){
  const p = new URLSearchParams({verify:'1', id:rec.id, name:rec.name, course:rec.course, level:rec.level, date:rec.date, sig:certSignature(rec)});
  return `${CERT_VERIFY_BASE}?${p.toString()}`;
}
function genCertificate(levelId){
  const cert = CERT_LEVELS.find(c=>c.id===levelId);
  if(!cert) return;
  let name = getLearnerName();
  if(!name){
    name = (prompt('Name for your certificate:') || '').trim();
    if(!name){ return; }
    setLearnerName(name);
  }
  const existing = lsGet('cert_'+levelId, null);
  const rec = existing || {
    id: nextCertId(), name, course: cert.course, level: cert.level, date: new Date().toISOString().slice(0,10)
  };
  if(!existing) lsSet('cert_'+levelId, rec);
  touchStreak();
  openCertificateModal(rec, cert);
}

function drawCertStars(canvas){
  if(!canvas) return;
  const ctx = canvas.getContext && canvas.getContext('2d');
  if(!ctx) return;
  const rect = canvas.getBoundingClientRect();
  canvas.width = rect.width; canvas.height = rect.height;
  ctx.fillStyle='#fff';
  for(let i=0;i<140;i++){
    ctx.globalAlpha = Math.random()*0.7+0.15;
    ctx.beginPath(); ctx.arc(Math.random()*canvas.width, Math.random()*canvas.height, Math.random()*1.2+0.2, 0, 7); ctx.fill();
  }
  ctx.globalAlpha=1;
}
function openCertificateModal(rec, cert){
  let modal = document.getElementById('cert-modal-backdrop');
  if(!modal){
    modal = document.createElement('div');
    modal.id = 'cert-modal-backdrop';
    modal.className = 'cert-modal-backdrop';
    modal.addEventListener('click', (e)=>{ if(e.target===modal) closeCertModal(); });
    document.body.appendChild(modal);
  }
  modal.innerHTML = `<div class="cert-modal-inner">
    ${certPanelHtml(rec, cert)}
    <div class="cert-actions">
      <button class="btn btn-primary" data-action="print-cert">Print / Save as PDF</button>
      <button class="btn" data-action="close-cert-modal">Close</button>
    </div>
  </div>`;
  modal.classList.add('show');
  setTimeout(()=>{
    drawCertStars(document.getElementById('cert-stars-canvas'));
    const qrBox = document.getElementById('cert-qr-box');
    if(qrBox && window.QRCode){
      try{
        new QRCode(qrBox, {text: qrBox.dataset.verifyUrl, width:200, height:200, colorDark:'#000000', colorLight:'#ffffff', correctLevel: QRCode.CorrectLevel.M});
      }catch(e){ qrBox.textContent='QR unavailable'; }
    }
  }, 30);
}
function closeCertModal(){
  const modal = document.getElementById('cert-modal-backdrop');
  if(modal) modal.classList.remove('show');
}
function parseCertVerifyInput(raw){
  raw = raw.trim();
  let params;
  try{
    if(raw.includes('?')) params = new URLSearchParams(raw.split('?')[1]);
    else if(raw.includes('=')) params = new URLSearchParams(raw);
    else return null;
  }catch(e){ return null; }
  const rec = {id:params.get('id')||'', name:params.get('name')||'', course:params.get('course')||'', level:params.get('level')||'', date:params.get('date')||''};
  const sig = params.get('sig')||'';
  if(!rec.id || !sig) return null;
  return {rec, sig};
}
function handleVerifyCertificate(){
  const input = document.getElementById('cert-verify-input').value;
  const box = document.getElementById('cert-verify-result');
  const parsed = parseCertVerifyInput(input);
  if(!parsed){
    box.className = 'cert-verify-result invalid';
    box.innerHTML = `Paste the full verification link from the certificate's QR code (or the query string after the "?") — a bare certificate ID alone can't be cryptographically checked.`;
    return;
  }
  const expected = certSignature(parsed.rec);
  if(expected === parsed.sig.toUpperCase()){
    box.className = 'cert-verify-result valid';
    box.innerHTML = `<b>✓ Signature valid.</b><br>Certificate <b>${esc(parsed.rec.id)}</b> was issued to <b>${esc(parsed.rec.name)}</b> for completing <b>${esc(parsed.rec.course)}</b> (${esc(parsed.rec.level)}), dated ${esc(prettyDate(parsed.rec.date))}.`;
  } else {
    box.className = 'cert-verify-result invalid';
    box.innerHTML = `<b>✗ Signature does not match.</b> This link's details don't match its signature — the certificate data may have been altered, or this isn't a genuine X Horizon certificate link.`;
  }
}

function renderRoute(){
  const {base, arg} = parseHash();
  renderSidebar(base==='project'?'projects':(base==='lesson'?'learn':base));
  renderTopbar(base);
  const fn = ROUTES[base] || ROUTES.home;
  window.scrollTo(0,0);
  document.getElementById('content').scrollTop = 0;
  try{ fn(arg); } catch(e){ document.getElementById('content').innerHTML = `<div class="empty-state">Something went wrong rendering this page.<br><span class="small">${esc(e.message)}</span></div>`; console.error(e); }
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('scrim').classList.remove('show');
}
function safeInitStarfield(){ try{ initStarfield(); }catch(e){ console.error('Starfield init failed (non-fatal):', e); } }
let _booted=false;
function boot(){ if(_booted) return; _booted=true; safeInitStarfield(); renderRoute(); }
window.addEventListener('hashchange', renderRoute);
window.addEventListener('DOMContentLoaded', boot);
if(document.readyState==='complete' || document.readyState==='interactive'){
  setTimeout(boot, 0);
}
})();
