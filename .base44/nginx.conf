# Static server for the exported X HORIZON site.
# The pages were exported from an Odoo website, so each route below is the clean
# URL the source pages link to, mapped to the HTML file that backs it.
# The repo is bind-mounted from the sandbox where files are owned by root with
# restrictive permissions, so the workers must be able to read them.
user root;

worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type text/html;
  charset utf-8;
  sendfile on;
  keepalive_timeout 65;
  server_tokens off;

  map $uri $xh_page {
    default "";

    # Landing + section index pages
    "/"                        "/Backup/Homepage .html";
    "/concepts"                "/Backup/Article Concepts.html";
    "/skills"                  "/Backup/Skills .html";
    "/career"                  "/Backup/Career.html";
    "/media"                   "/Backup/Media.html";

    # Concept categories
    "/universe-cosmology"                       "/Backup/Article Concepts Categories/universe-cosmology (3).html";
    "/galaxy-large-scale-structure"             "/Backup/Article Concepts Categories/galaxy-large-scale-structure (1).html";
    "/black-holes-related-phenomena"            "/Backup/Article Concepts Categories/black-holes-related-concepts.html";
    "/solar-system-planetary-science"           "/Backup/Article Concepts Categories/solar-system-planetary-science.html";
    "/space-technology-exploration"             "/Backup/Article Concepts Categories/space-technology-exploration.html";
    "/exoplanets-astrobiology"                  "/Backup/Article Concepts Categories/exoplanets-astrobiology (1).html";
    "/nebula-interstellar-objects"              "/Backup/Article Concepts Categories/nebula-interstellar-objects.html";
    "/stars-stellar-evolution"                  "/Backup/Article Concepts Categories/Stars & Stellar Evolution.html";
    "/quantum-physics-particle-concepts"        "/Backup/Article Concepts Categories/quantum-physics-particle-concepts.html";
    "/gravity-relativity"                       "/Backup/Article Concepts Categories/gravity-relativity.html";
    "/high-energy-phenomena-transient-events"   "/Backup/Article Concepts Categories/high-energy-phenomena-transient-events.html";
    "/sun-solar-phenomena"                      "/Backup/Article Concepts Categories/sun-solar-phenomena.html";
    "/human-spaceflight-life-support-system"    "/Backup/Article Concepts Categories/human-spaceflight-life-support-system.html";
    "/astrodynamics-life-support-system"        "/Backup/Article Concepts Categories/astrodynamics-life-support-system.html";
    "/software-tools-in-space-science"          "/Backup/Article Concepts Categories/software-tools-in-space-science.html";
    "/astronomy-observational-terms"            "/Backup/Article Concepts Categories/astronomy-observational-terms.html";
    "/miscellaneous-terms"                      "/Backup/Article Concepts Categories/miscellaneous-terms.html";

    # Skills
    "/rocket-lab"              "/Backup/Skills/preview.html";
    "/telescope-handling"      "/Backup/Skills/Telescope Handling Lab (3).html";
    "/astrophotography"        "/Backup/Skills/x-horizon-astrophotography-dark-neutral.html";
    "/space-data-handling"     "/Backup/Skills/space-data-handling (2).html";
    "/python-learning"         "/Backup/Skills/python-space-academy (1).html";
    "/satellite-operations"    "/Backup/Skills/satellite-operations (1).html";
    "/orbital-mechanics"       "/Backup/Skills/orbital-mechanics (1).html";
    "/scientific-writing"      "/Backup/Skills/scientific-writing (1).html";
    "/mathematics"             "/Backup/Skills/x-horizon-mathematics-lab (1).html";

    # Career
    "/scholarships-internships" "/Backup/Career/Scholarship & Internship.html";
    "/universities"             "/Backup/Career/Global Universities.html";
    "/space-companies"          "/Backup/Career/Space Companies.html";
    "/industries"               "/Backup/Career/Industries.html";

    # Community
    "/social-learning"          "/Backup/community/social learning.html";
    "/professional-platforms"   "/Backup/community/professional platforms.html";
    "/apps"                     "/Backup/community/Apps & Softwares.html";

    # Live
    "/live"                     "/Backup/Live/Live ISS.html";
    "/live-events"              "/Backup/Live/Live Events.html";

    # Simulations
    "/solar-system"             "/Backup/Simulations/Solar System (Not Refined).html";
    "/satellites"               "/Backup/Simulations/Satellites.html";
    "/stellar-sky"              "/Backup/Simulations/Stellar Sky.html";
    "/celestial-sphere"         "/Backup/Simulations/Celestial Sphere.html";
    "/black-hole"               "/Backup/Simulations/Black Hole.html";
    "/where-we-are"             "/Backup/Simulations/Where We Are.html";

    # Featured
    "/collaboration"            "/Backup/Featured/Collaboration.html";
    "/gravity-simulator"        "/Backup/Featured/Gravity Simulator (Need Upgrade).html";
    "/cosmic-calendar"          "/Backup/Featured/Cosmic Calendar( Not Refined_.html";
    "/mission-designer"         "/Backup/Featured/Mission Engineering Suit.html";
    "/weather-forecast"         "/Backup/Featured/Weather Forecast.html";
    "/muslim-special"           "/Backup/Featured/Muslim Special.html";
    "/dr-clary-s-special"       "/Backup/Featured/Dr.Clarissa.html";

    # Footer / special pages
    "/xhorizon-vision"          "/Backup/Footer  Special/About X HORIZON.html";
    "/community-guidelines"     "/Backup/Footer  Special/Community Guidelines.html";
    "/cosmic-gear"              "/Backup/Footer  Special/Cosmic Gear.html";
    "/pakistan-s-special"       "/Backup/Footer  Special/Pakistan Special.html";
    "/platform-rules"           "/Backup/Footer  Special/Platform Rules.html";
    "/portfolio"                "/Backup/Footer  Special/Portfolio.html";
    "/ratings-reviews"          "/Backup/Footer  Special/Ratings & Reviews.html";
    "/space-gallery"            "/Backup/Footer  Special/Space Gallery.html";
    "/space-library"            "/Backup/Footer  Special/Space Library.html";
    "/space-news"               "/Backup/Footer  Special/Space Updates.html";
    "/suggest-us"               "/Backup/Footer  Special/Suggest Us.html";
    "/sitemap"                  "/Backup/Footer  Special/xhorizon-sitemap.html";
  }

  server {
    listen 3000;
    server_name _;
    root /app;

    add_header Cache-Control "no-store" always;

    # These two pages were exported with a .txt extension but hold HTML.
    location = /history {
      default_type text/html;
      alias "/app/Backup/Media/History.txt";
    }
    location = /videos {
      default_type text/html;
      alias "/app/Backup/Media/Videos.txt";
    }

    location / {
      try_files $xh_page $uri $uri/ =404;
    }
  }
}
