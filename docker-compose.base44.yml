# Base44 dev environment for the X HORIZON static site.
# The repo is a static export (HTML fragments + CSS + media), so there is no build
# step: nginx serves the bind-mounted working tree so edits are live on refresh.
services:
  web:
    image: nginx:alpine
    restart: on-failure
    ports:
      - "3000:3000"
    volumes:
      - ./:/app:ro
      - ./.base44/nginx.conf:/etc/nginx/nginx.conf:ro
    labels:
      base44.project: "X HORIZON"
      base44.kind: "web"
      base44.port: "3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
